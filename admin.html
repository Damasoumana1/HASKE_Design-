<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HASKE Design — Administration</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/dynamic.css"><script src="/admin.js" defer></script></head><body><header class="header"><a class="brand" href="/">HASKE DESIGN</a><span>Gestion des demandes</span><button id="logout" hidden>Se déconnecter</button></header><main class="wrap section"><section id="login"><h1>Votre atelier.</h1><p>Connectez-vous pour consulter les projets reçus.</p><form id="login-form"><div class="field"><label for="password">Mot de passe administrateur</label><input id="password" type="password" autocomplete="current-password" required></div><button class="button" type="submit">Se connecter</button></form></section><p id="admin-status" role="status" aria-live="polite"></p><section id="dashboard" hidden><h1>Les projets reçus.</h1><p id="mail-status"></p><button class="button outline" id="refresh">Actualiser</button><div id="requests"></div><div class="export-actions"><button id="previous" class="button outline">Page précédente</button><span id="page"></span><button id="next" class="button outline">Page suivante</button></div></section></main></body></html>
